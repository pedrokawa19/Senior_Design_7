{% extends "base.html" %}
{% block title %}Purchasing Dashboard{% endblock %}
{% block content %}
    <main class="dashboard-content">
      <section class="card profitability-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Year To Date</p>
            <h2>Most Profitable Products</h2>
          </div>
        </div>
        <div id="profitability-content">
          <p class="info">Loading profitability data...</p>
        </div>
      </section>
      <section class="card index-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Market Performance</p>
            <div class="market-heading" aria-live="polite">
              <h2 id="ticker-title">{{ default_ticker_name }}</h2>
              <div class="market-quote">
                <strong id="ending-close" aria-label="Selected range ending close"></strong>
                <strong id="growth" class="growth"></strong>
              </div>
            </div>
          </div>
        </div>
        <div class="date-controls">
          <label
            >Ticker<select id="ticker">
              {% for symbol, name in ticker_names.items %}
              <option value="{{ symbol }}" data-name="{{ name }}">{{ symbol }}</option>
              {% endfor %}
            </select></label
          ><label
            >From<input id="start-date" type="date" value="2024-01-01" /></label
          ><label>To<input id="end-date" type="date" /></label>
        </div>
        <div id="market-content">
          <p class="info">Loading market data...</p>
        </div>
      </section>
    </main>
    <script>
      const marketContent = document.querySelector("#market-content");
      const profitabilityContent = document.querySelector("#profitability-content");

      let latestMarketData = null;
      let chartObserver = null;
      let chartMetrics = null;
      let marketRequest = 0;

      document.querySelector("#end-date").value = new Date()
        .toISOString()
        .slice(0, 10);

      function escapeHtml(value) {
        return String(value === null || value === undefined ? "" : value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      async function jsonRequest(path, options = {}) {
        const response = await fetch(path, {
          credentials: "same-origin",
          ...options,
        });
        let data = null;
        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }
        if (!response.ok) {
          throw new Error((data && data.detail) || "The request failed.");
        }
        return data || {};
      }

      async function loadProfitability() {
        profitabilityContent.innerHTML =
          '<p class="info">Loading profitability data...</p>';
        try {
          const data = await jsonRequest("/api/profitable-products");
          const rows = data.products
            .map(
              (item) =>
                `<tr><td>${item.rank}</td><td class="product-name">${escapeHtml(item.product)}</td><td>$${item.ytd_profit.toLocaleString(undefined, { maximumFractionDigits: 2 })}</td><td>${item.profit_share.toFixed(2)}%</td></tr>`,
            )
            .join("");
          profitabilityContent.innerHTML = `<div class="table-wrapper"><table class="profit-table"><thead><tr><th>#</th><th>Product</th><th>Profit</th><th>%</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        } catch (error) {
          profitabilityContent.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      function buildChartSvg(data, width, height) {
        const values = data.prices;
        const pad = { top: 18, right: 20, bottom: 34, left: 64 };
        const innerWidth = Math.max(width - pad.left - pad.right, 10);
        const innerHeight = Math.max(height - pad.top - pad.bottom, 10);
        const closes = values.map((item) => item.close);
        const lowest = Math.min(...closes);
        const highest = Math.max(...closes);
        const spread = highest - lowest || Math.max(highest * 0.02, 1);
        const min = lowest - spread * 0.1;
        const max = highest + spread * 0.1;
        const baseline = pad.top + innerHeight;
        const x = (index) =>
          pad.left +
          (values.length < 2
            ? innerWidth / 2
            : (index / (values.length - 1)) * innerWidth);
        const y = (value) => pad.top + ((max - value) / (max - min)) * innerHeight;

        chartMetrics = { x, y, pad, innerWidth, baseline, width };

        const linePoints = values
          .map((item, index) => `${x(index).toFixed(1)},${y(item.close).toFixed(1)}`)
          .join(" ");
        const areaPoints = `${pad.left},${baseline.toFixed(1)} ${linePoints} ${(pad.left + innerWidth).toFixed(1)},${baseline.toFixed(1)}`;

        const tickCount = 4;
        let grid = "";
        for (let step = 0; step <= tickCount; step += 1) {
          const value = min + (step / tickCount) * (max - min);
          const position = y(value);
          grid += `<line class="chart-grid" x1="${pad.left}" x2="${(pad.left + innerWidth).toFixed(1)}" y1="${position.toFixed(1)}" y2="${position.toFixed(1)}"></line>`;
          grid += `<text class="chart-label" x="${pad.left - 10}" y="${(position + 4).toFixed(1)}" text-anchor="end">$${value.toFixed(2)}</text>`;
        }

        const labelCount = Math.min(values.length, width < 520 ? 3 : 5);
        let labels = "";
        for (let step = 0; step < labelCount; step += 1) {
          const index = Math.round(
            (step / Math.max(labelCount - 1, 1)) * (values.length - 1),
          );
          const anchor =
            step === 0 ? "start" : step === labelCount - 1 ? "end" : "middle";
          labels += `<text class="chart-label" x="${x(index).toFixed(1)}" y="${height - 10}" text-anchor="${anchor}">${values[index].date}</text>`;
        }

        const lastIndex = values.length - 1;
        return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(data.ticker)} closing price chart">
            <defs>
              <linearGradient id="chart-area-fill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#1f4e79" stop-opacity="0.34"></stop>
                <stop offset="100%" stop-color="#1f4e79" stop-opacity="0.02"></stop>
              </linearGradient>
            </defs>
            ${grid}
            <polygon class="chart-area" points="${areaPoints}"></polygon>
            <polyline class="chart-line" points="${linePoints}"></polyline>
            <circle class="chart-marker" cx="${x(lastIndex).toFixed(1)}" cy="${y(values[lastIndex].close).toFixed(1)}" r="4"></circle>
            <line class="chart-axis" x1="${pad.left}" x2="${pad.left}" y1="${pad.top}" y2="${baseline.toFixed(1)}"></line>
            <line class="chart-axis" x1="${pad.left}" x2="${(pad.left + innerWidth).toFixed(1)}" y1="${baseline.toFixed(1)}" y2="${baseline.toFixed(1)}"></line>
            ${labels}
            <g id="chart-hover" visibility="hidden" pointer-events="none">
              <line id="chart-hover-guide" class="chart-hover-guide" y1="${pad.top}" y2="${baseline}"></line>
              <circle id="chart-hover-dot" class="chart-marker" r="5"></circle>
            </g>
          </svg>`;
      }

      function renderChart() {
        const wrapper = document.querySelector("#chart-wrapper");
        if (!wrapper || !latestMarketData) {
          return;
        }
        const width = Math.round(wrapper.clientWidth);
        const height = Math.round(wrapper.clientHeight);
        if (width < 60 || height < 60) {
          return;
        }
        wrapper.innerHTML = buildChartSvg(latestMarketData, width, height)
          + '<div class="chart-tooltip" hidden role="status"></div>';
        const tooltip = wrapper.querySelector(".chart-tooltip");
        const hover = wrapper.querySelector("#chart-hover");
        const guide = wrapper.querySelector("#chart-hover-guide");
        const dot = wrapper.querySelector("#chart-hover-dot");
        const values = latestMarketData.prices;
        const metrics = chartMetrics;
        let selectedIndex = values.length - 1;

        // Snap to a real trading day and keep the tooltip inside the chart.
        function showPoint(index) {
          selectedIndex = Math.max(0, Math.min(values.length - 1, index));
          const point = values[selectedIndex];
          const x = metrics.x(selectedIndex);
          const y = metrics.y(point.close);
          guide.setAttribute("x1", x);
          guide.setAttribute("x2", x);
          dot.setAttribute("cx", x);
          dot.setAttribute("cy", y);
          hover.setAttribute("visibility", "visible");
          tooltip.textContent = `${point.date} · $${point.close.toFixed(2)}`;
          tooltip.hidden = false;
          tooltip.style.left = `${Math.max(8, Math.min(x + 12, width - tooltip.offsetWidth - 8))}px`;
          tooltip.style.top = `${Math.max(8, Math.min(y - tooltip.offsetHeight - 12, height - tooltip.offsetHeight - 8))}px`;
        }
        function hidePoint() {
          tooltip.hidden = true;
          hover.setAttribute("visibility", "hidden");
        }
        wrapper.onpointermove = wrapper.onpointerdown = (event) => {
          const bounds = wrapper.getBoundingClientRect();
          const x = (event.clientX - bounds.left) * width / bounds.width;
          showPoint(Math.round((x - metrics.pad.left) / metrics.innerWidth * (values.length - 1)));
        };
        wrapper.onpointerleave = wrapper.onblur = hidePoint;
        wrapper.onfocus = () => showPoint(selectedIndex);
        // Keyboard users can inspect the same points without a mouse.
        wrapper.onkeydown = (event) => {
          if (event.key === "Escape") { hidePoint(); return; }
          const index = {
            ArrowLeft: selectedIndex - 1, ArrowRight: selectedIndex + 1,
            Home: 0, End: values.length - 1,
          }[event.key];
          if (index !== undefined) { event.preventDefault(); showPoint(index); }
        };
      }

      function showMarketData(data) {
        latestMarketData = data;
        marketContent.innerHTML = `<div class="chart-wrapper" id="chart-wrapper" tabindex="0" aria-label="${escapeHtml(data.ticker)} closing prices. Hover or use left and right arrow keys to inspect dates and prices."></div>`;
        renderChart();

        if (chartObserver) {
          chartObserver.disconnect();
        }
        chartObserver = new ResizeObserver(() => renderChart());
        chartObserver.observe(document.querySelector("#chart-wrapper"));
      }

      async function loadMarket() {
        // Only the latest selection may update the heading and chart.
        const requestId = ++marketRequest;
        const selection = document.querySelector("#ticker");
        const ticker = selection.value;
        const startDate = document.querySelector("#start-date").value;
        const endDate = document.querySelector("#end-date").value;
        document.querySelector("#ticker-title").textContent = selection.selectedOptions[0].dataset.name;
        document.querySelector("#ending-close").textContent = "";
        document.querySelector("#growth").textContent = "";
        if (chartObserver) chartObserver.disconnect();
        latestMarketData = null;
        marketContent.innerHTML = `<p class="info">Loading ${escapeHtml(ticker)} data...</p>`;
        try {
          const query = new URLSearchParams({
            start_date: startDate,
            end_date: endDate,
            ticker: ticker,
          });
          const data = await jsonRequest(`/api/index-performance?${query}`);
          if (requestId !== marketRequest) return;
          if (!data.prices || !data.prices.length) throw new Error("No closing prices found for this date range.");
          document.querySelector("#ticker-title").textContent = data.name || selection.selectedOptions[0].dataset.name;
          document.querySelector("#ending-close").textContent = "$" + data.last_close.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          const growthElement = document.querySelector("#growth");
          growthElement.textContent = `${data.growth_percentage >= 0 ? "+" : ""}${data.growth_percentage.toFixed(2)}%`;
          growthElement.className =
            data.growth_percentage >= 0
              ? "growth growth-positive"
              : "growth growth-negative";
          showMarketData(data);
        } catch (error) {
          if (requestId !== marketRequest) return;
          document.querySelector("#ending-close").textContent = "";
          document.querySelector("#growth").textContent = "";
          marketContent.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      document.querySelector("#ticker").onchange = loadMarket;
      document.querySelector("#start-date").onchange = loadMarket;
      document.querySelector("#end-date").onchange = loadMarket;

      async function initialize() {
        let savedConnection = null;
        try {
          const data = await jsonRequest("/api/connection");
          savedConnection = data.connection;
        } catch (error) {
          savedConnection = null;
        }
        if (savedConnection) {
          loadProfitability();
        } else {
          profitabilityContent.innerHTML = `<p class="info">Add your database connection on the <a href="{% url 'profile' %}">Profile</a> page to load this table.</p>`;
        }
        loadMarket();
      }

      initialize();
    </script>
{% endblock %}
